<text x="82" y="1076" font-size="16" font-weight="700" fill="#EBCB8B">비중 공식</text>
<text x="82" y="1114" font-size="17" font-family="monospace" fill="#ECEFF4">k = 0.60 × clip( 20 / VIX , 0.5 , 2.0 )</text>
<text x="82" y="1144" font-size="17" font-family="monospace" fill="#ECEFF4">alloc = min( k × 엔진비중 , 1.0 )</text>
<text x="82" y="1176" font-size="14" fill="#34A5C5">VIX↑ (공포) → 비중↓   ·   VIX↓ (안정) → 비중↑</text>
