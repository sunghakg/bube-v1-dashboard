<text x="34" y="488" font-size="12.5" fill="#ECEFF4">VIX9D/VIX &gt; 1.05 (단기공포 역전)</text>
<text x="34" y="507" font-size="12.5" fill="#ECEFF4">→ 투표 무시하고 즉시 BEAR</text>
<text x="34" y="526" font-size="12.5" fill="#ECEFF4">평활·dwell 없음 = 매일 새로 판정</text>
<text x="34" y="545" font-size="12.5" fill="#ECEFF4">(어제 레짐 기억 안 함 · 무상태)</text>
<text x="34" y="564" font-size="12.5" fill="#ECEFF4">BEAR 연속 &gt;90일 → 황금변기</text>
