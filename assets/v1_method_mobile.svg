<text x="16" y="63" font-size="10.5" fill="#34A5C5" font-weight="600">레짐 판정 → 엔진 선택 → 돌파 진입 → 갭필터 → VIX 사이징 → 청산</text>
<circle cx="29" cy="91" r="12" fill="#81A1C1" fill-opacity="0.18" stroke="#81A1C1" stroke-width="1.8"/>
