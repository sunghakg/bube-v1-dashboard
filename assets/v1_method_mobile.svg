<text x="34" y="154" font-size="14" font-weight="700" fill="#81A1C1">🗳 5신호 투표 (전일 종가)</text>
<line x1="34" y1="164" x2="341" y2="164" stroke="#4C566A"/>
<text x="34" y="184" font-size="12.5" fill="#ECEFF4">① VIX: ≤18 강세 · &gt;30 약세</text>
<text x="34" y="203" font-size="12.5" fill="#ECEFF4">② QQQ 주간 RSI14: ≥60 강세 · &lt;40 약세</text>
<text x="34" y="222" font-size="12.5" fill="#ECEFF4">③ SPY vs 200일선: ±2% 밴드</text>
<text x="34" y="241" font-size="12.5" fill="#ECEFF4">④ SOXL vs 50일선: ±5% 밴드</text>
<text x="34" y="260" font-size="12.5" fill="#ECEFF4">⑤ SOXL 5일 모멘텀: ±5% 밴드</text>
