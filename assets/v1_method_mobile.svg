<text x="34" y="306" font-size="14" font-weight="700" fill="#EBCB8B">⚖ soft 분류 — 위험회피 비대칭</text>
<line x1="34" y1="316" x2="341" y2="316" stroke="#4C566A"/>
<text x="34" y="336" font-size="12.5" fill="#ECEFF4">약세 ≥ 2표  →  🔴 BEAR</text>
<text x="34" y="355" font-size="12.5" fill="#ECEFF4">강세 ≥ 3표  →  🟢 BULL</text>
<text x="34" y="374" font-size="12.5" fill="#ECEFF4">그 외        →  🟡 NEUTRAL</text>
<text x="34" y="393" font-size="12.5" fill="#ECEFF4">곰은 2표면 인정 · 소는 3표 필요</text>
<text x="34" y="412" font-size="12.5" fill="#ECEFF4">= 하락 위험에 더 민감하게 반응</text>
<rect x="16" y="434" width="343" height="142" rx="12" fill="#3B4252" fill-opacity="1.0" stroke="#BF616A" stroke-opacity="0.8" stroke-width="1.4"/>
<rect x="16" y="434" width="6" height="142" rx="3" fill="#BF616A"/>
<text x="34" y="458" font-size="14" font-weight="700" fill="#BF616A">⚡ fast-BEAR + 무상태</text>
