<text x="34" y="1865" font-size="13" font-family="monospace" fill="#ECEFF4">k = 0.60 × clip( 20/VIX, 0.5, 2.0 )</text>
<text x="34" y="1887" font-size="13" font-family="monospace" fill="#ECEFF4">alloc = min( k × 엔진비중, 1.0 )</text>
<text x="34" y="1911" font-size="12" fill="#34A5C5">VIX↑(공포)→비중↓ · VIX↓(안정)→비중↑</text>
